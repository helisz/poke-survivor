<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon-32-BLfTnpdA-BLfTnpdA.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="./assets/favicon-16-Bq_HgsZ3-Bq_HgsZ3.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="./assets/favicon-By8WPdr8-By8WPdr8.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./assets/apple-touch-icon-C-cpwQ8l-C-cpwQ8l.png" />
    <title>Poke Survivor</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0a0f14;
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
      }
      /* 关键：100dvh = 动态视口高度，随浏览器工具栏收放实时变化。
         100vh 在移动端是"工具栏隐藏时的最大高度"，会溢出到工具栏后面。 */
      #game {
        position: fixed;
        top: 0;
        left: 0;
        /* 宽度用 100% 而非 100vw：100vw 含滚动条宽度，会和 JS 读到的
           innerWidth 差几个像素，画布被拉伸后就是「画面偏大」的来源。 */
        width: 100%;
        height: 100vh;          /* 老浏览器兜底 */
        height: 100dvh;         /* 现代浏览器：真实可见高度 */
        height: var(--vh, 100dvh); /* JS 用视口校准值精确覆盖 */
      }
      canvas { display: block; }
      #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: #449ddf; font: 600 16px/1.6 -apple-system, "PingFang SC", sans-serif; letter-spacing: 2px; }
    </style>
    <!-- 入口固定指向源码：vite 靠这一行才知道从哪打包。
         产物文件名由 build 自己决定，scripts/publish.mjs 负责把生成的
         真实文件名回写到仓库根 index.html（根目录 = 线上静态站点）。
         别手改成 ./assets/xxx.js —— 会解析失败/指向旧产物。 -->
    <script type="module" crossorigin src="./assets/index-CHwvVmTn.js"></script>
  </head>
  <body>
    <div id="boot">LOADING…</div>
    <div id="game"></div>
  </body>
</html>
