<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Poke Survivor</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0a0f14;
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
      }
      /* 关键：100dvh = 动态视口高度，随浏览器工具栏收放实时变化。
         100vh 在移动端是"工具栏隐藏时的最大高度"，会溢出到工具栏后面。 */
      #game {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;          /* 老浏览器兜底 */
        height: 100dvh;         /* 现代浏览器：真实可见高度 */
        height: var(--vh, 100dvh); /* JS 用 visualViewport 精确校准 */
      }
      canvas { display: block; }
      #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: #449ddf; font: 600 16px/1.6 -apple-system, "PingFang SC", sans-serif; letter-spacing: 2px; }
    </style>
    <script type="module" crossorigin src="./assets/index-CP_WEo0E.js"></script>
  </head>
  <body>
    <div id="boot">LOADING…</div>
    <div id="game"></div>
  </body>
</html>
